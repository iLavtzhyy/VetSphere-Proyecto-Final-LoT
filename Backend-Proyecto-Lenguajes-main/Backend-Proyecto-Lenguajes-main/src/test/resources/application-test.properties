# =====================================================================
# Perfil "test": base de datos H2 en memoria y valores de prueba.
# Se carga despues de application.properties y application-local.properties,
# por lo que sobreescribe datasource, JPA, JWT, correo, SOAP y semilla.
# Nunca usa red real: el chat no tiene API key y el correo no envia nada.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:vetsphere;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# data.sql usa sintaxis de SQL Server, en H2 la carga la hace el seeder (JPA)
spring.sql.init.mode=never

# Clave JWT solo para pruebas (HMAC SHA-256 exige >= 32 bytes)
app.jwt.secret=vetsphere-clave-secreta-de-pruebas-0123456789abcdef0123456789abcdef
app.jwt.expiration-ms=1800000

app.upload-dir=target/test-uploads

# Correo: sin credenciales no se envia ningun mensaje real
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

# Credenciales SOAP de prueba (coinciden con los ejemplos de src/test/resources/soap-requests)
vetsphere.soap.security.username=vetsphere-test
vetsphere.soap.security.password=soap-test-123

# Datos de demostracion: se habilitan los usuarios de prueba del seeder
app.seed.password=Demo123!
app.demo.seed-password=Demo123!

# Asistente sin API key: /api/chat debe responder el mensaje de "no configurado"
app.chat.api-key=
app.chat.base-url=https://api.openai.com/v1
app.chat.modelo=gpt-4o-mini
