server.port=8090
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=VeterinariaMiniDB;encrypt=true;trustServerCertificate=false}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update

# Credenciales y URL del servicio SOAP principal
vetsphere.soap.url=${VETSPHERE_SOAP_URL:http://localhost:8080/soap/productos}
vetsphere.soap.username=${SOAP_USERNAME}
vetsphere.soap.password=${SOAP_PASSWORD}
app.api.token=${APP_API_TOKEN}
