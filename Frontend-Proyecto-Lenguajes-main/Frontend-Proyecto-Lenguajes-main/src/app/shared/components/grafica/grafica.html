<div class="grafica-marco" [style.height]="altura" [attr.aria-busy]="cargando">
  <canvas
    #lienzo
    class="grafica-lienzo"
    role="img"
    [attr.aria-label]="resumen || titulo"
    [attr.aria-hidden]="cargando || error ? 'true' : null"></canvas>

  <div class="grafica-estado bg-white/95 dark:bg-slate-900/95" *ngIf="cargando" role="status">
    <app-cargador [centrado]="false" texto="Cargando gráfica…"></app-cargador>
  </div>

  <div class="grafica-estado bg-white/95 dark:bg-slate-900/95" *ngIf="!cargando && error" role="alert">
    <div class="flex flex-col items-center gap-2 px-6 text-center">
      <app-icono name="alert" [size]="22" class="text-rose-600 dark:text-rose-300"></app-icono>
      <p class="text-sm font-bold text-rose-700 dark:text-rose-300">{{ error }}</p>
    </div>
  </div>

  <div class="grafica-estado bg-white/95 dark:bg-slate-900/95 px-6 text-center" *ngIf="!cargando && !error && !configuracion">
    <p class="text-sm font-bold text-slate-500 dark:text-slate-400">{{ vacio }}</p>
  </div>
</div>

<p class="mt-3 text-xs leading-5 text-slate-500 dark:text-slate-400"
   *ngIf="configuracion && !cargando && !error && resumen">{{ resumen }}</p>
