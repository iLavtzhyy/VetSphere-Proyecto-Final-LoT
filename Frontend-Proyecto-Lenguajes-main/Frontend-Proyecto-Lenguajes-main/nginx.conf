# VetSphere - nginx: sirve el SPA y hace proxy de la API al backend
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API REST del backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Cadena de frío IoT FastAPI (REST y WebSocket)
    location /iot/ {
        proxy_pass http://cold-chain-iot:8091/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Documentación Swagger
    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
    }

    # SPA: cualquier ruta desconocida va al index del enrutador
    location / {
        try_files $uri $uri/ /index.html;
    }
}
