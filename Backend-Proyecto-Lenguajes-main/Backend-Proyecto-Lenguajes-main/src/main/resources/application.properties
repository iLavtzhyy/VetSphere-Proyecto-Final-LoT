spring.application.name=Veterinaria
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=VeterinariaDB;encrypt=true;trustServerCertificate=false}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

cxf.path=/soap

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=1800000
app.upload-dir=uploads
app.pagos.pichincha.numero-cuenta=${PICHINCHA_NUMERO_CUENTA:}
app.pagos.pichincha.titular=${PICHINCHA_TITULAR:}
app.pagos.pichincha.identificacion=${PICHINCHA_IDENTIFICACION:}
app.pagos.pichincha.qr-url=${PICHINCHA_QR_URL:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

vetsphere.soap.security.username=${SOAP_USERNAME}
vetsphere.soap.security.password=${SOAP_PASSWORD}
vetsphere.soap.url=${SOAP_URL:http://127.0.0.1:${server.port}/soap/productos}
app.registration.admin-code=${ADMIN_REGISTRATION_CODE:}
app.seed.password=${DEMO_SEED_PASSWORD:}
app.demo.seed-password=${DEMO_SEED_PASSWORD:}

# Asistente inteligente (compatible con la API de OpenAI de chat/completions).
# Sin CHAT_API_KEY el endpoint /api/chat responde un mensaje amigable de "no configurado".
app.chat.base-url=${CHAT_BASE_URL:https://api.openai.com/v1}
app.chat.api-key=${CHAT_API_KEY:}
app.chat.modelo=${CHAT_MODEL:gpt-4o-mini}
app.chat.retencion-dias=${CHAT_RETENTION_DAYS:7}

# Tarifas base del sistema (USD). El IVA del 15% se calcula siempre en el servidor.
app.tarifas.consulta=${TARIFA_CONSULTA:45.00}
app.tarifas.cirugia=${TARIFA_CIRUGIA:280.00}
app.tarifas.laboratorio=${TARIFA_LABORATORIO:35.00}
app.tarifas.hospitalizacion=${TARIFA_HOSPITALIZACION:45.00}
app.tarifas.emergencia=${TARIFA_EMERGENCIA:120.00}
app.tarifas.vacuna=${TARIFA_VACUNA:35.00}
app.tarifas.control=${TARIFA_CONTROL:65.00}

# Datos de la clinica usados en el comprobante de venta en PDF.
app.clinica.nombre=${CLINICA_NOMBRE:VetSphere - Clinica Veterinaria Integral}
app.clinica.ruc=${CLINICA_RUC:}
app.clinica.direccion=${CLINICA_DIRECCION:Av. Cristobal Colon E10-45 y Av. 12 de Octubre, Quito (La Floresta)}
app.clinica.telefono=${CLINICA_TELEFONO:0999999999}
app.clinica.email=${CLINICA_EMAIL:contacto@vetsphere.com}
app.clinica.web=${CLINICA_WEB:www.vetsphere.com}
app.clinica.licencia=${CLINICA_LICENCIA:}
app.moneda=${MONEDA:USD}

# Politica de seguridad de acceso.
# 3 intentos fallidos bloquean la cuenta durante 3 horas.
app.seguridad.max-intentos=${SEGURIDAD_MAX_INTENTOS:3}
app.seguridad.horas-bloqueo=${SEGURIDAD_HORAS_BLOQUEO:3}
app.seguridad.minutos-codigo=${SEGURIDAD_MINUTOS_CODIGO:10}
app.seguridad.max-codigos-hora=${SEGURIDAD_MAX_CODIGOS_HORA:5}

# Documentacion OpenAPI (la UI queda protegida por rol ADMIN en produccion)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorting=alpha
springdoc.swagger-ui.tags-sorting=alpha
